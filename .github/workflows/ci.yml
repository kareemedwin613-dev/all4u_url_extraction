name: CI

# Every pull request and every push to main must pass the same gate as `npm run check`:
# lint, typecheck, security scan, dashboard/root, matching, JD review, API, and tailoring
# tests, and the dashboard, extension, API, and tailoring builds.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/contracts/package-lock.json
            apps/api/package-lock.json
            apps/tailoring-worker/package-lock.json
      - run: npm ci
      - run: npm ci --prefix packages/contracts
      - run: npm ci --prefix apps/api
      - run: npm ci --prefix apps/tailoring-worker
      - run: npm run check
